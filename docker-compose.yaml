services:
  ################################################################################
  # Nginx
  #   This is configured as a reverse proxy to:
  #   1. To direct traffic in the right places (e.g. "/", "/api", etc)
  #   2. To host data files for the image gallery (which nginx is doing itself)
  ################################################################################
  nginx:
    build:
      context: ./src/nginx
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ${GALLERY_PATH:-./data/evaluation}
        target: /gallery
        read_only: true
        bind:
          selinux: Z
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ]
      interval: 2m
      timeout: 30s
      retries: 5
      start_period: 30s

    depends_on:
      - backend
      - frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000" ]
      interval: 2m
      timeout: 30s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
      target: base
    volumes:
      - type: bind
        source: ./models/
        target: /app/models
        read_only: true
        bind:
          selinux: Z
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      # TODO: Why are these even defined for the backend. These should be for the frontend.
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
