services:
  ################################################################################
  # Nginx
  #   This is configured as a reverse proxy to:
  #   1. To direct traffic in the right places (e.g. "/", "/api", etc)
  #   2. To host data files for the image gallery (which nginx is doing itself)
  ################################################################################
  nginx:
    build:
      context: ./src/nginx
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ${GALLERY_PATH}
        target: /gallery
        read_only: true
        bind:
          selinux: Z

    depends_on:
      - backend
      - frontend
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_USE_MOCK_API: ${NEXT_PUBLIC_USE_MOCK_API:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000" ]
      interval: 2m
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    # Temporary API stub; replace with the real backend image when available.
    image: python:3.12-alpine
    command:
      - python
      - -c
      - >-
        from http.server import BaseHTTPRequestHandler, HTTPServer; HTTPServer(("", 8000), type("Handler", (BaseHTTPRequestHandler,), { "do_GET": lambda self: (self.send_response(200), self.end_headers(), self.wfile.write(b"hello")), "log_message": lambda self, *args: None})).serve_forever()
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s
