[project]
name = "zero-shot-route-segmentation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub",
    "numpy",
    "opencv-python",
    "pillow",
    "pycocotools",
    "torch",
    "transformers",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
# Direct dependencies used by notebooks/sam3_bouldering_point_prompts.ipynb.
sam3-notebook = [
    "torch",
    "transformers",
    "huggingface-hub",
    "pillow",
    "numpy",
    "matplotlib",
    "ipympl",
    "jupyterlab",
]
