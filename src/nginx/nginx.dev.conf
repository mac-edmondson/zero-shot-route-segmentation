server {
  listen 80;
  client_max_body_size 50M;

  # Development-only proxy for the external sample-image gallery.
  location /api/images/ {
    proxy_pass https://cvp.iamemacs.com/api/images/;
    proxy_ssl_server_name on;
    proxy_set_header Host cvp.iamemacs.com;
  }

  # Backend (FastAPI)
  location /api/ {
    proxy_pass http://backend:8000/; # Strips Prefix

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend (Next.js)
  location / {
    proxy_pass http://frontend:3000/; # Strips Prefix

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
