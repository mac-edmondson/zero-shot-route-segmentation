server {
  listen 80;
  client_max_body_size 50M;

  # Gallery photos proxied through /api/image/working/segments can run to
  # several MB (some categories, e.g. `sm`, exceed nginx's 1m default),
  # which otherwise 413s before the request ever reaches the backend.
  client_max_body_size 20m;

  # Development-only proxy for the external sample-image gallery. Host is a
  # variable so `resolver` (Docker's DNS, IPv6 disabled) resolves it per
  # request -- this network has no IPv6 route, and cvp.iamemacs.com has an
  # IPv6 record. $request_uri is forwarded as-is, matching the upstream's
  # path structure (/api/images/<category>/...).
  resolver 127.0.0.11 ipv6=off valid=30s;

  location /api/images/ {
    set $gallery_upstream cvp.iamemacs.com;
    proxy_pass https://$gallery_upstream$request_uri;
    proxy_ssl_server_name on;
    proxy_set_header Host cvp.iamemacs.com;
  }

  # Backend (FastAPI)
  location /api/ {
    proxy_pass http://backend:8000/; # Strips Prefix

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend (Next.js)
  location / {
    proxy_pass http://frontend:3000/; # Strips Prefix

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
